name: field.blocks.image.name
icon: image
preview: image
fields:
  image:
    label: field.blocks.image.name
    type: files
    query: model.images
    multiple: false
    link: false
    image:
      back: black
    uploads:
      template: blocks/image
  alt:
    label: field.blocks.image.alt
    type: text
    help: Alternative text, or alt text, is a short written description of an image that helps people who use screen readers understand its content and function when the image cannot be seen.
    icon: title
  caption:
    label: field.blocks.image.caption
    type: writer
    icon: text
    inline: true
  link:
    label: field.blocks.image.link
    type: text
    icon: url
  ratio:
    label: field.blocks.image.ratio
    type: select
    placeholder: Auto
    width: 1/2
    options:
      1/1: "1:1"
      16/9: "16:9"
      4/3: "4:3"
  crop:
    label: field.blocks.image.crop
    type: toggle
    width: 1/2