title: You're logged in as that one girl with pink hair

columns:
  main:
    width: 2/3
    sections:
      pages:
        label: Homepage
        type: pages
        image:
          icon: false
          cover: true
          ratio: 1/1
          back: '#d81a7d'
          query: false
        min: 1
        max: 1
        templates:
          - home
      site:
        type: fields
        fields:
          infoText:
            label: Info Text
            type: writer
            marks:
              - bold
              - italic
              - underline
              - strike
              - link
              - clear
            nodes: false
          contactText:
            label: Contact Text
            type: writer
            marks:
              - bold
              - italic
              - underline
              - strike
              - link
              - email
              - clear
            nodes:
              - bulletList
              - orderedList
  sidebar:
    width: 1/3
    sections:
      attachments:
        type: files
        template: document
        batch: true
        help: Upload here the pdf files you want to use as attachments on your website.
      seo:
        type: fields
        fields:
          description:
            label: SEO Description
            type: textarea
            buttons: false
          keywords:
            label:
              en: SEO Keywords
              it: Parole chiave  
            type: tags
            separator: ','
          ogImage:
            label: Social Sharing Image
            type: files
            multiple: false
            query: site.images
            uploads: image
            image:
              cover: true
              ratio: 1200/630
              back: white
            help: Shown when the site is shared on social media or in chats. Best at 1200 × 630 px (JPG or PNG).
          favicon:
            label: Favicon
            type: files
            multiple: false
            query: site.images
            uploads: image
            image:
              cover: false
              ratio: 1/1
              back: white
            help: Shown in browser tabs and as the home screen icon on phones. Use a square image, at least 180 × 180 px (PNG recommended).
