title: Cluster

num: default

status:
  draft:
    label: Hidden
    text: Not shown on the site.
  listed:
    label: Shown
    text: Shown on the site, in the order of the clusters list.

options:
  changeTemplate: false
  preview: "{{ page.parent.url }}"

columns:
  main:
    width: 2/3
    sections:
      cluster:
        label: Images
        type: fields
        fields:
          gallery:
            type: files
            template: image
            layout: cards
            size: small
            limit: 100
            link: false
            image:
              ratio: 4/3
              back: white
              cover: true
  sidebar:
    width: 1/3
    sections:
      content:
        type: fields
        fields:
          filters:
            label: Filters
            type: select
            options:
              type: query
              query: page.parent.filterList.toStructure
              value: "{{ item.key }}"
              text: "{{ item.name }}"
            help: Pick from the filters listed on Home.
          readMore:
            label: Read more
            type: blocks
            help: Optional. When filled, a "Read more" button appears among the cluster's images and opens this text in a side panel.
            fieldsets:
             - text
             - image
