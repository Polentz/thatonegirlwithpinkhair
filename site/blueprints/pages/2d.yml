title: 2D prototype

options: 
  changeSlug: true
  changeStatus: true
  changeTemplate: false
  cheangeTitle: true
  create: false
  delete: false
  duplicate: false
  list: true
  move: false
  preview: true
  sort: false
  update: true


sections:
  content:
    type: fields
    fields:
      howToText:
        label: How to Text
        type: writer
        marks:
          - bold
          - italic
          - underline
          - strike
          - link
          - email
          - clear
        nodes: false
      clusters:
        label: Clusters
        type: structure
        help: Each cluster is a group of images with its text.
        columns:
          images:
            width: 2/3
          text:
            width: 1/3
        fields:
          images:
            label: Images
            type: files
            template: image
            uploads: image
            multiple: true
            image:
              icon: true
              ratio: 4/3
              back: white
              cover: true
          text:
            label: Text
            type: writer
            marks:
              - bold
              - italic
              - underline
              - strike
              - link
              - clear
            nodes: false
