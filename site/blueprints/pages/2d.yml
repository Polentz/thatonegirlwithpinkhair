title: 2D prototype

options: 
  changeSlug: true
  changeStatus: true
  changeTemplate: false
  cheangeTitle: true
  create: false
  delete: false
  duplicate: false
  list: true
  move: false
  preview: true
  sort: false
  update: true


sections:
  content:
    type: fields
    fields:
      howToText:
        label: How to Text
        type: writer
        marks:
          - bold
          - italic
          - underline
          - strike
          - link
          - email
          - clear
        nodes: false
      filterList:
        label: Filters
        type: tags
        help: The filters visitors can choose from. Assign them to each cluster below; only filters used by at least one cluster appear on the site. If you rename a filter here, clusters that already use the old name keep it and won't match the new one, so pick the new name again in those clusters.
      clusters:
        label: Clusters
        type: structure
        help: Each cluster is a group of images with its text.
        columns:
          images:
            width: 1/2
          text:
            width: 1/4
          filters:
            width: 1/4
        fields:
          images:
            label: Images
            type: files
            template: image
            uploads: image
            multiple: true
            image:
              icon: true
              ratio: 4/3
              back: white
              cover: true
          text:
            label: Text
            type: writer
            marks:
              - bold
              - italic
              - underline
              - strike
              - link
              - clear
            nodes: false
          filters:
            label: Filters
            type: multiselect
            options:
              type: query
              query: page.filterList.split
