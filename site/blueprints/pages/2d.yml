title: 2D prototype

options: 
  changeSlug: true
  changeStatus: true
  changeTemplate: false
  cheangeTitle: true
  create: false
  delete: false
  duplicate: false
  list: true
  move: false
  preview: true
  sort: false
  update: true

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          clusters:
            label: Clusters
            type: structure
            help: Each cluster is a group of images with its text.
            columns:
              images:
                width: 1/2
              text:
                width: 1/4
              filters:
                width: 1/4
            fields:
              filters:
                label: Filters
                type: multiselect
                options:
                  type: query
                  query: page.filterList.toStructure
                  value: "{{ item.key }}"
                  text: "{{ item.name }}"
              text:
                label: Title
                type: writer
                marks: false
                nodes: false
              images:
                label: Images
                type: files
                template: image
                uploads: image
                multiple: true
                image:
                  icon: true
                  ratio: 4/3
                  back: white
                  cover: true
              readMore:
                label: Read more
                type: writer
                help: Optional. When filled, a "Read more" button appears among the cluster's images and opens this text in a side panel.
                marks:
                  - bold
                  - italic
                  - underline
                  - strike
                  - link
                  - email
                  - clear
  sidebar:
    width: 1/3
    sections:
      features:
        type: fields
        fields:
          howToText:
            label: How to Text
            type: writer
            marks:
              - bold
              - italic
              - underline
              - strike
              - link
              - email
              - clear
            nodes: false
          filterList:
            label: Filters
            type: structure
            columns:
              name: true
            fields:
              name:
                label: Name
                type: text
                required: true
              key:
                type: hidden
            help: The filters visitors can choose from, in this order. Assign them to each cluster below; only filters used by at least one cluster appear on the site. Renaming a filter updates it everywhere; deleting it removes it from every cluster. Save after adding a new filter to make it selectable in the clusters.