title: You're logged in as that one girl with pink hair

sections:
  content:
    type: fields
    fields:
      clusters:
        label: Clusters
        type: structure
        help: Each cluster is a group of images. Clicking the cluster stamps its text.
        columns:
          images:
            width: 2/3
          text:
            width: 1/3
        fields:
          images:
            label: Images
            type: files
            template: image
            uploads: image
            multiple: true
            image:
              icon: true
              ratio: 4/3
              back: white
              cover: true
          text:
            label: Text
            type: writer
            marks:
              - bold
              - italic
              - underline
              - strike
              - link
              - clear
            nodes: false
