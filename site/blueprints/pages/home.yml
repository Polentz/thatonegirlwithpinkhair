title: Home

options: 
  changeSlug: false
  changeStatus: true
  changeTemplate: false
  changeTitle: true
  create: false
  delete: false
  duplicate: false
  list: true
  move: false
  preview: true
  sort: false
  update: true

columns:
  main:
    width: 2/3
    sections:
      clusters:
        label: Clusters
        type: pages
        template: cluster
        status: all
        layout: list
        sortable: true
        image:
          query: page.images.sorted.first
          ratio: 4/3
          back: white
          cover: true
        help: Each cluster is a group of images with its text. Drag to reorder; hidden clusters are not shown on the site.
  sidebar:
    width: 1/3
    sections:
      features:
        type: fields
        fields:
          howToText:
            label: How to Text
            type: writer
            marks:
              - bold
              - italic
              - underline
              - strike
              - link
              - email
              - clear
            nodes:
              - bulletList
              - orderedList
          filterList:
            label: Filters
            type: tags
            help: The filters visitors can choose from. Assign them in each cluster; only filters used by at least one cluster appear on the site. If you rename a filter here, clusters that already use the old name keep it and won't match the new one, so pick the new name again in those clusters.
