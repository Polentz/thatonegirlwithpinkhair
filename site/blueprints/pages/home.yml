title: Home

options: 
  changeSlug: false
  changeStatus: true
  changeTemplate: false
  changeTitle: true
  create: false
  delete: false
  duplicate: false
  list: true
  move: false
  preview: true
  sort: false
  update: true

columns:
  main:
    width: 2/3
    sections:
      clusters:
        label: Clusters
        type: pages
        template: cluster
        status: all
        batch: true
        search: true
        sortable: false
        layout: table
        sortable: true
        image: false
        columns:
          title:
            width: 1/4
          filters:
            label: Filters
            width: 1/4
          images:
            label: Images
            type: html
            value: "{{ page.panelThumbs }}"
            width: 1/2
        help: Each cluster is a group of images with its text. Hidden clusters are not shown on the website.
  sidebar:
    width: 1/3
    sections:
      features:
        type: fields
        fields:
          howToText:
            label: How to Text
            type: writer
            marks:
              - bold
              - italic
              - underline
              - strike
              - link
              - email
              - clear
            nodes:
              - bulletList
              - orderedList
          filterList:
            label: Filters
            type: tags
            layout: list
            help: The filters visitors can choose from. Assign them in each cluster; only filters used by at least one cluster appear on the site. If you rename a filter here, clusters that already use the old name keep it and won't match the new one, so pick the new name again in those clusters.
